name: Build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          # HttpServer is an add-on module, not part of the default Qt install.
          # Required by this project and the templnote-ai submodule.
          modules: 'qthttpserver'

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Guard reusable libraries against GUI dependencies
        run: |
          link_line=$(grep 'build templnote-headless:' build/build.ninja | head -1)
          for lib in Qt6Gui Qt6Quick Qt6Qml Qt6Widgets Qt6OpenGL; do
            if echo "$link_line" | grep -q "lib$lib"; then
              echo "ERROR: headless links $lib — reusable layers must stay GUI-free"
              exit 1
            fi
          done
          if grep -r -n '#include "model/\|#include <QGui\|#include <QQuick\|#include <QJSValue' \
              src/store src/sync \
              third_party/templnote-editor/src \
              third_party/templnote-ai/src \
              third_party/templnote-plugins/sdk/src/core; then
            echo "ERROR: GUI include found in a reusable library"
            exit 1
          fi

      - name: Run tests
        run: >
          ctest --test-dir build --output-on-failure
          -E "EditorQmlTests|SearchWindowQmlTests"
